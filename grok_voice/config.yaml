name: "Grok Voice"
description: "Live Grok (xAI) voice assistant with a big tap-to-talk page, made for the in-car browser"
version: "0.2.1"
slug: "grok_voice"
init: false
arch:
  - aarch64
  - amd64
stage: experimental
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: "mdi:microphone-message"
panel_title: "Grok Voice"
# Optional direct listener (off by default). Only starts when `access_token`
# is set. Map it in the app's Network section, then expose it over HTTPS
# (e.g. a Cloudflare Tunnel hostname) to use it as a top-level page.
ports:
  8100/tcp: null
ports_description:
  8100/tcp: "Optional direct web UI (needs access_token, must be put behind HTTPS)"
options:
  xai_api_key: ""
  model: "grok-voice-latest"
  voice: "eve"
  reasoning_effort: "high"
  system_prompt: "You are Grok, a voice assistant riding in Benjamin's car. Keep answers short, calm and spoken-friendly: plain sentences, no markdown, lists, emoji or URLs. Ask at most one short follow-up question. If a request needs the driver to look at a screen or do something complicated, suggest doing it once parked."
  allow_ha_control: false
  wrenchworks_enabled: false
  wrenchworks_base_url: "http://local-wrenchworks:8099"
  wrenchworks_save_enabled: false
schema:
  xai_api_key: password
  model: str
  voice: str
  reasoning_effort: list(high|none)
  system_prompt: str
  allow_ha_control: bool
  access_token: password?
  wrenchworks_enabled: bool
  wrenchworks_base_url: str
  wrenchworks_password: password?
  wrenchworks_mcp_token: password?
  wrenchworks_save_enabled: bool
# `image:` is intentionally omitted so Supervisor builds locally.
# For a published multi-arch image set e.g.: image: "ghcr.io/OWNER/grok-voice"
